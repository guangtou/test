name: Mask input value example

on:
  workflow_dispatch:
    inputs:
      secret_input:
        description: '敏感输入（例如 token）'
        required: true

jobs:
  mask-input:
    runs-on: ubuntu-latest
    steps:
      - name: 屏蔽输入参数
        run: |
          echo "::add-mask::${{ github.event.inputs.secret_input }}"
          echo "输入值被屏蔽：${{ github.event.inputs.secret_input }}"
