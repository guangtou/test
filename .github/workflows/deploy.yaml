name: 多参数示例

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境（如 staging、production）'
        required: true
        default: 'staging'
      version:
        description: '发布版本号（如 v1.2.3）'
        required: false
      app_name:
        description: '应用名称'
        required: true
        default: 'my-app'
      deploy_user:
        description: '部署人'
        required: false
      region:
        description: '部署区域（如 cn, us, eu）'
        required: false
        default: 'cn'

jobs:
  show-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: 打印所有输入参数（作为环境变量）
        run: env

      - name: 打印date
        run: date
